<style>


	/* MAIN CONTAINERS ================================================================ */
    /* ============================================================================================== */

        .enowaParagraphContainer{

            width:100%;
            top:0;
            left:0;
            right:0;
            bottom:0;
            margin:0px auto 0px auto;
            position:relative;
            transition:all 600ms ease;
            -o-transition:all 600ms ease;
            -ms-transition:all 600ms ease;
            -moz-transition:all 600ms ease;
            -webkit-transition:all 600ms ease;

        }

            .enowaParagraphContentResizer{

                width:800px;
                color:#3A5668;
                margin:0px auto;
                position:relative;
                text-align:left;
                transition:all 600ms ease;
                -o-transition:all 600ms ease;
                -ms-transition:all 600ms ease;
                -moz-transition:all 600ms ease;
                -webkit-transition:all 600ms ease;

            }






	/* DEFAULT STATES ================================================================== */
    /* ============================================================================================== */

        /* DEFAULT PARAGRAPH CONTENT FILL ================================== */
        /* ========================================================================================== */

        /* SPECIAL TAGS ================================================================ */
        /* ========================================================================================== */

            p{

                margin:0;
                transition:all 600ms ease;
                -o-transition:all 600ms ease;
                -ms-transition:all 600ms ease;
                -moz-transition:all 600ms ease;
                -webkit-transition:all 600ms ease;

            }




                /* SECTION DEFAULT PARAGRAPH CONTAINER ====== */
                /* ================================================================================== */

                    .enowaParagraphContentTextContainer{

                        width:100%;
                        color:#3A5668;
                        padding:10px 0px 0px 0px;
                        font-size:12px;
                        letter-spacing:0.5px;
                        transition:all 600ms ease;
                        -o-transition:all 600ms ease;
                        -ms-transition:all 600ms ease;
                        -moz-transition:all 600ms ease;
                        -webkit-transition:all 600ms ease;

                    }

                        .enowaParagraphContentTextActual{

                            width:100%;
                            transition:all 600ms ease;
                            -o-transition:all 600ms ease;
                            -ms-transition:all 600ms ease;
                            -moz-transition:all 600ms ease;
                            -webkit-transition:all 600ms ease;

                        }

                            


</style>



<!-- MAIN CONTAINER ======================================================================= -->
<!-- =============================================================================================== -->

    <div class="enowaParagraphContainer">

        <div class="enowaParagraphContentResizer">

            <div class="enowaParagraphContentTextContainer">

                <div class="enowaParagraphContentTextActual">

                    ${properties.paragraphBody @context='html' || 'no text to display'}

                </div>

            </div>

        </div>

    </div>
