<style>


	/* MAIN CONTAINERS ================================================================ */
    /* ============================================================================================== */

        .enowaHeadlineParagraphComboContainer{

            width:100%;
            top:0;
            left:0;
            right:0;
            bottom:0;
            margin:50px auto 0px auto;
            position:relative;
            transition:all 600ms ease;
            -o-transition:all 600ms ease;
            -ms-transition:all 600ms ease;
            -moz-transition:all 600ms ease;
            -webkit-transition:all 600ms ease;

        }

            .enowaHeadlineParagraphComboContentResizer{

                width:800px;
                color:#3A5668;
                margin:0px auto;
                position:relative;
                text-align:left;
                transition:all 600ms ease;
                -o-transition:all 600ms ease;
                -ms-transition:all 600ms ease;
                -moz-transition:all 600ms ease;
                -webkit-transition:all 600ms ease;

            }






	/* DEFAULT STATES ================================================================== */
    /* ============================================================================================== */

        /* DEFAULT SECTION HEADLINE CONTENT FILL ================================== */
        /* ========================================================================================== */

        /* SPECIAL TAGS ================================================================ */
        /* ========================================================================================== */

            p{

                margin:0;
                transition:all 600ms ease;
                -o-transition:all 600ms ease;
                -ms-transition:all 600ms ease;
                -moz-transition:all 600ms ease;
                -webkit-transition:all 600ms ease;

            }




                /* SECTION COMBO HEADLINE TEXT CONTAINER ====== */
                /* ================================================================================== */

                    .enowaHeadlineParagraphComboHeadlineContentTextContainer{

                        width:100%;
                        color:#3A5668;
                        padding:0px 0px 0px 0px;
                        font-size:18px;
                        font-weight:900;
                        letter-spacing:0.5px;
                        transition:all 600ms ease;
                        -o-transition:all 600ms ease;
                        -ms-transition:all 600ms ease;
                        -moz-transition:all 600ms ease;
                        -webkit-transition:all 600ms ease;

                    }

                        .enowaHeadlineParagraphComboHeadlineContentTextActual{

                            width:100%;
                            transition:all 600ms ease;
                            -o-transition:all 600ms ease;
                            -ms-transition:all 600ms ease;
                            -moz-transition:all 600ms ease;
                            -webkit-transition:all 600ms ease;

                        }




                /* SECTION COMBO PARAGRAPH TEXT CONTAINER ====== */
                /* ================================================================================== */

                    .enowaHeadlineParagraphComboParagraphContentTextContainer{

                        width:100%;
                        color:#3A5668;
                        padding:20px 0px 0px 0px;
                        font-size:12px;
                        letter-spacing:0.5px;
                        transition:all 600ms ease;
                        -o-transition:all 600ms ease;
                        -ms-transition:all 600ms ease;
                        -moz-transition:all 600ms ease;
                        -webkit-transition:all 600ms ease;

                    }

                        .enowaHeadlineParagraphComboParagraphContentTextActual{

                            width:100%;
                            transition:all 600ms ease;
                            -o-transition:all 600ms ease;
                            -ms-transition:all 600ms ease;
                            -moz-transition:all 600ms ease;
                            -webkit-transition:all 600ms ease;

                        }

                            


</style>



<!-- MAIN CONTAINER ======================================================================= -->
<!-- =============================================================================================== -->

    <div class="enowaHeadlineParagraphComboContainer">

        <div class="enowaHeadlineParagraphComboContentResizer">




            <!-- SECTION COMBO HEADLINE TEXT CONTAINER ================================================================ -->
            <!-- =================================================================================== -->

                <div class="enowaHeadlineParagraphComboHeadlineContentTextContainer">

                    <div class="enowaHeadlineParagraphComboHeadlineContentTextActual">

                        ${properties.comboHeadlineText || 'no text to display'}

                    </div>

                </div>




            <!-- PARAGRAPH TEXT CONTAINER ================================================================ -->
            <!-- =================================================================================== -->

                <div class="enowaHeadlineParagraphComboParagraphContentTextContainer">

                    <div class="enowaHeadlineParagraphComboParagraphContentTextActual">

                        ${properties.comboParagraphBody @context='html' || 'no text to display'}

                    </div>

                </div>




        </div>

    </div>
